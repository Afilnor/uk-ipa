name: Deploy license server

on:
  push:
    branches: [master]
    paths: ['license-server/**']
  workflow_dispatch:

concurrency: license-server-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: license-server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is configured
        id: configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.configured.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.configured.outputs.ok == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: license-server/package-lock.json
      - if: steps.configured.outputs.ok == 'true'
        run: npm ci && npm test && npm run deploy
